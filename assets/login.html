<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به پنل — ASPI PANEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <!-- Theme toggle (floating on the login page) -->
  <button type="button" class="icon-btn theme-toggle auth-theme" id="theme-toggle" aria-label="تغییر پوسته روشن/تیره" title="تغییر پوسته">
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="auth">
    <!-- Brand panel -->
    <section class="auth__brand" aria-label="معرفی">
      <div class="auth__lines" aria-hidden="true"></div>
      <div class="auth__brand-inner">
        <p class="auth__wordmark" dir="ltr">ASPI<br>PANEL</p>
        <p class="auth__tagline">پنل مدیریت تیم</p>
      </div>
    </section>

    <!-- Form panel -->
    <main class="auth__form-wrap">
      <div class="card auth__card">
        <h1 class="auth__title">ورود به پنل</h1>
        <p class="auth__sub">برای ادامه، اطلاعات حساب خود را وارد کنید.</p>

        <!-- Error message (remove the hidden attribute to show) -->
        <div class="form-error" role="alert" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
          <span>نام کاربری یا رمز عبور اشتباه است.</span>
        </div>

        <!-- Notice / success variant (remove the hidden attribute to show) -->
        <div class="form-error form-error--notice" role="status" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
          <span>رمز عبور شما با موفقیت تغییر کرد. اکنون وارد شوید.</span>
        </div>

        <form class="form" novalidate>
          <div class="field">
            <label for="username">نام کاربری</label>
            <input class="input" type="text" id="username" name="username" autocomplete="username" placeholder="نام کاربری خود را وارد کنید" dir="ltr" required>
          </div>

          <div class="field">
            <label for="password">رمز عبور</label>
            <!-- Masked with CSS so the "show password" checkbox works without JS -->
            <input class="input input--mask" type="text" id="password" name="password" autocomplete="current-password" placeholder="رمز عبور خود را وارد کنید" dir="ltr" required>
          </div>

          <div class="check-row">
            <input class="check" type="checkbox" id="show-password" name="show_password">
            <label for="show-password">نمایش رمز عبور</label>
          </div>

          <div class="check-row">
            <input class="check" type="checkbox" id="remember" name="remember">
            <label for="remember">مرا به خاطر بسپار</label>
          </div>

          <button type="submit" class="btn btn--block">ورود</button>
          <a class="link link--center" href="#">رمز عبور خود را فراموش کرده‌اید؟</a>
        </form>

        <p class="auth__legal">© ASPI PANEL — تمامی حقوق محفوظ است.</p>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var r = document.documentElement;
      r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
