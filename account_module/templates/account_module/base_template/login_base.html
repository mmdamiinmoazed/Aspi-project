<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به پنل — ASPI PANEL</title>
  {% include 'includes/styles.html' %}
</head>
<body class="auth-body">
  {% include 'includes/template_loader.html' %}

  {% block content %}
  {% endblock %}

  <!-- اسکریپت‌های سیستمی و کتابخانه‌ها -->
  <script src="{% static 'js/loader.js' %}?v=2"></script>
  <script src="{% static 'js/jalalidatepicker.min.js' %}"></script>

  <script>
    // فعال‌سازی تقویم جلالی
    if (typeof jalaliDatepicker !== 'undefined') {
      jalaliDatepicker.startWatch();
    }

    // تغییر تم (Dark / Light) همراه با ذخیره در حافظه
    var themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var r = document.documentElement;
        var nextTheme = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        r.setAttribute('data-theme', nextTheme);
        try { localStorage.setItem('theme', nextTheme); } catch(e) {}
      });
    }

    // Voting: تغییر وضعیت انحصاری
    var voteBtns = document.querySelectorAll('.vote__btn');
    if (voteBtns.length) {
      voteBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var isCurrentlyPressed = btn.getAttribute('aria-pressed') === 'true';
          voteBtns.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          if (!isCurrentlyPressed) {
            btn.setAttribute('aria-pressed', 'true');
          }
        });
      });
    }

    // Task progress counter
    var boxes = document.querySelectorAll('.tasks .check');
    var progressEl = document.querySelector('.progress[role="progressbar"]');
    var progressBar = progressEl ? progressEl.querySelector('.progress__bar') : null;
    var taskProgressText = document.getElementById('task-progress');

    function updateTasks() {
      if (!boxes.length) return;
      var done = 0;
      boxes.forEach(function (b) { if (b.checked) done++; });
      var pct = Math.round((done / boxes.length) * 100);

      if (taskProgressText) {
        taskProgressText.textContent = done.toLocaleString('fa-IR') + ' از ' + boxes.length.toLocaleString('fa-IR');
      }
      if (progressEl) {
        progressEl.setAttribute('aria-valuenow', pct);
      }
      if (progressBar) {
        progressBar.style.width = pct + '%';
      }
    }

    if (boxes.length) {
      boxes.forEach(function (b) { b.addEventListener('change', updateTasks); });
      updateTasks();
    }

    // فرم کامنت
    var commentForm = document.querySelector('.comment-form');
    if (commentForm) {
      commentForm.addEventListener('submit', function (e) {
        e.preventDefault();
      });
    }

    // فیلد آپلود فایل
    var projectFileInput = document.getElementById('project-file');
    var fileNameDisplay = document.getElementById('file-name');
    if (projectFileInput && fileNameDisplay) {
      projectFileInput.addEventListener('change', function () {
        fileNameDisplay.textContent = this.files.length ? this.files[0].name : 'هنوز فایلی انتخاب نشده است.';
      });
    }
  </script>
</body>
</html>
